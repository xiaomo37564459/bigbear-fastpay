# pay.copliot.cloud —— FastPay 易支付
#
# ⚠️ 换服务器时先看这里：下面用到的 $connection_upgrade 变量不是 nginx 内置的，
# 它定义在 /etc/nginx/nginx.conf 的 http 块里：
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# 新机器上如果没有这段，直接 nginx -t 就会报 unknown "connection_upgrade" variable，
# 站点起不来。先把它加进 nginx.conf，再放这个文件。

# HTTP (ACME challenge & redirect to HTTPS)
server {
  listen 80; server_name pay.copliot.cloud;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

# pay.copliot.cloud - HTTPS (FastPay 易支付)
server {
  listen 443 ssl; http2 on; server_name pay.copliot.cloud;
  ssl_certificate     /etc/nginx/ssl/copliot.cloud/fullchain.cer;
  ssl_certificate_key /etc/nginx/ssl/copliot.cloud/copliot.cloud.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # 收款码是 base64 存的，请求体会比较大
  client_max_body_size 20m;

  access_log /var/log/nginx/pay.copliot.access.log main;
  error_log  /var/log/nginx/pay.copliot.error.log;

  # 前端静态文件根目录：/opt/fastpay/www/{fastpay-admin,fastpay-merchant}
  root /opt/fastpay/www;

  # 接口文档一律不对外。后端 application-prod.yml 里已经默认关掉了，
  # 这里再挡一层，避免以后有人误开了配置就直接暴露在公网上。
  location ~ ^/fastpay-server/(v3/api-docs|swagger-ui|swagger-resources|doc\.html|webjars/) {
    return 404;
  }

  # 后端 API + WebSocket -> fastpay-server (127.0.0.1:7001)
  # 注意：支付成功后页面自动跳转依赖 /fastpay-server/ws/pay/... 这条 WebSocket，
  # 下面的 Upgrade / Connection 两行不能删。
  location /fastpay-server/ {
    proxy_pass http://127.0.0.1:7001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # 构建产物带内容 hash，可以长缓存
  location ~* ^/fastpay-(admin|merchant)/assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 管理后台（单页应用，刷新不能 404）
  location /fastpay-admin/ {
    try_files $uri $uri/ /fastpay-admin/index.html;
  }
  location = /fastpay-admin { return 301 /fastpay-admin/; }

  # 商户端（单页应用，刷新不能 404）
  location /fastpay-merchant/ {
    try_files $uri $uri/ /fastpay-merchant/index.html;
  }
  location = /fastpay-merchant { return 301 /fastpay-merchant/; }

  # 根路径 -> 商户端（用户入口）
  location = / { return 301 /fastpay-merchant/; }
}
