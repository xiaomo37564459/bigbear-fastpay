# 每个 PR 自动跑一遍：先把当天最新的主干（master）合进来，再跑全部测试。
#
# 为什么要先合主干：以前经常出现「开发在自己拉分支那天的主干上测试是绿的，等验收时合到最新主干上
# 其实是红的」，白白多转一轮。这个检查就是把这件事提前到提交代码的那一刻，由机器发现。
#
#
# ⚠️⚠️⚠️ 改这个文件之前先看这一段 ⚠️⚠️⚠️
#
# master 上现在开了分支保护，它是**按名字**点名要下面这四项必须绿才给合并：
#
#     2·后端测试 fastpay-server（MySQL + PostgreSQL）
#     3·前端测试 (fastpay-admin)
#     3·前端测试 (fastpay-merchant)
#     4·运维脚本自测（发版验证 + 生产操作锁）
#
# 只要改动了上面任何一个名字（包括往括号里多加一个字），GitHub 就再也等不到那个名字了，
# **所有 PR 会永远卡在「等待检查上报」，而且一声不吭 —— 不报错、不变红，就是合不进去。**
# 这个坑真踩过一次（MTM-211：往第 4 项名字里加了「+ 撞车提醒」，PR 当场卡死）。
#
# 所以：
#   - 这一格里加了新的自测，**只改步骤（step）的名字，别动 job 的 name**
#   - 真要改名，必须和改分支保护同时做：先加新名字进保护名单，等新名字上报绿了，再撤旧的。
#     单独改任何一边都会把所有人堵在门外
#   - 保护名单在哪看：仓库页 → Settings → Branches → master → Require status checks
#
# 「1·先合最新主干」「5·一句话结论」不在保护名单里，改名不会卡住合并。
name: PR 检查（先合最新主干再跑测试）

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # 手动触发：在 Actions 页面选一个分支跑，同样会先把主干合进来

permissions:
  contents: read

env:
  # 整套系统是按东八区设计的（application-dev.yml 里 Jackson 的 time-zone、MySQL 连接串里的
  # serverTimezone 都写死了 Asia/Shanghai），开发同学的机器也都在东八区。GitHub 的机器默认是 UTC，
  # 时区对不上，MySQL 那条路径的「订单超时自动关单」测试就会挂。这里把 CI 机器的时区调成跟开发机、
  # 跟配置一致，保证「本地绿 = CI 绿」。
  # 注意：这不是绕开测试。测试挂在时区上这件事本身是个隐患（真部署到 UTC 的服务器上会重现），
  # 已经在 MTM-183 里单独提出来给后端跟进，这里只负责让 CI 环境和开发环境保持一致。
  TZ: Asia/Shanghai

# 同一个 PR 连着推好几次时，只保留最后一次的检查结果，前面的自动取消，省时间也省得看花眼
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-master:
    name: 1·先合最新主干
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      master-sha: ${{ steps.merge.outputs.master-sha }}
      head-sha: ${{ steps.merge.outputs.head-sha }}
    steps:
      # 注意：这里故意取 PR 分支自己的提交（head.sha），而不是 GitHub 默认给的那个已经合好的临时版本，
      # 因为我们要自己动手合一次，才能在合不上的时候明确告诉你「跟主干冲突了」。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: merge
        uses: ./.github/actions/merge-master
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

  backend:
    name: 2·后端测试 fastpay-server（MySQL + PostgreSQL）
    needs: merge-master
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/merge-master
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          # 用第一步定好的那笔主干提交，保证几项检查跑的是同一个主干版本
          master-sha: ${{ needs.merge-master.outputs.master-sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 端到端测试会在本机临时拉起真的 MariaDB 和 PostgreSQL（不用 Docker）。
      # MariaDB 自带的可执行文件要用到这几个系统库，Ubuntu 24.04 上包名带了 t64 后缀，
      # 装完再补一个软链，让它按老名字也能找得到。
      - name: 装内嵌数据库要用的系统库
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libaio1t64 libncurses6 libtinfo6 || \
            sudo apt-get install -y --no-install-recommends libaio1 libncurses5 libtinfo5
          for lib in libaio.so.1 libncurses.so.5 libtinfo.so.5; do
            if ! ldconfig -p | grep -q "$lib"; then
              case "$lib" in
                libaio.so.1)      src=$(ls /usr/lib/x86_64-linux-gnu/libaio.so.1t64 2>/dev/null || true) ;;
                libncurses.so.5)  src=$(ls /usr/lib/x86_64-linux-gnu/libncurses.so.6* 2>/dev/null | head -1 || true) ;;
                libtinfo.so.5)    src=$(ls /usr/lib/x86_64-linux-gnu/libtinfo.so.6* 2>/dev/null | head -1 || true) ;;
              esac
              [ -n "${src:-}" ] && sudo ln -sf "$src" "/usr/lib/x86_64-linux-gnu/$lib" || true
            fi
          done
          sudo ldconfig

      - name: 跑后端测试（mvn -B test）
        working-directory: fastpay-server
        run: mvn -B test

      # 测试报告留档：红了可以点进这个附件看具体是哪几项失败、失败原因是什么
      - name: 收走测试报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: 后端测试报告-surefire
          path: fastpay-server/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: 3·前端测试
    needs: merge-master
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # 一个前端红了，另一个照样跑完，一次看清全部问题
      matrix:
        app: [fastpay-admin, fastpay-merchant]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/merge-master
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          master-sha: ${{ needs.merge-master.outputs.master-sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 装依赖（npm ci）
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: 跑前端测试（npm test）
        working-directory: ${{ matrix.app }}
        run: npm test

      # 测试红了也照样打一次包，好让人一次看清「是测试挂了还是连编译都过不去」
      - name: 打包（npm run build）
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.app }}
        run: npm run build

  # 发版验证脚本（deploy/verify-release.sh）自己也有一套自测。它守着一个很危险的坑：
  # 脚本明明一个字都没从数据库查回来，却报「数据库连得上」，然后把人指去补跑迁移脚本 ——
  # 库本身好好的，人却被指去改生产库，方向正好指反。
  #
  # 这套自测以前只能靠人记得手动跑，机器一次都不碰。等于守门的人有了，但没人叫他上岗：
  # 谁哪天把那段判断改回老写法，检查照样全绿放行，坑就悄悄回来了。所以放进这里，每个 PR 都跑。
  #
  # 这一项很便宜（十几秒）：自测不连数据库、不要服务器、不要 root，只用 bash 跑一遍纯文本比对。
  deploy-verify:
    # ⚠️⚠️ 这一行的名字不能改，改了所有 PR 都合不进去。原因见文件开头那段警告。
    #      这一格里现在跑三个脚本的自测（发版验证、生产操作锁、撞车提醒），
    #      具体跑了哪几个看下面的步骤名，别往这个名字里加。
    name: 4·运维脚本自测（发版验证 + 生产操作锁）
    needs: merge-master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/merge-master
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          master-sha: ${{ needs.merge-master.outputs.master-sha }}

      - name: 跑自测（bash deploy/verify-release.test.sh）
        run: bash deploy/verify-release.test.sh

      # 生产操作锁：拦「两路人同时动同一台生产服务器」（MTM-210）。
      # 这个脚本最要命的错法不是报错，是**该拦没拦** —— 放行是安安静静的，
      # 没有任何报错也没有告警，等发现的时候两边已经在同一台机器上对着干了。
      # 所以它必须有人替我们盯着，不能只靠改的人自己记得跑。
      - name: 跑自测（bash deploy/prod-lock.test.sh）
        run: bash deploy/prod-lock.test.sh

      # 撞车提醒（MTM-211）：这个脚本最要命的错法同样是**该报没报** —— 漏报是安安静静的，
      # 没有报错也没有告警，等发现的时候又是三个人做了同一件事、都做完了才知道。
      # 所以它也得有人替我们盯着，不能只靠改的人自己记得跑。这一项不联网、十几秒就完。
      - name: 跑自测（bash .github/scripts/pr-overlap.test.sh）
        run: bash .github/scripts/pr-overlap.test.sh

  summary:
    name: 5·一句话结论
    needs: [merge-master, backend, frontend, deploy-verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总
        env:
          MERGE_RESULT: ${{ needs.merge-master.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPLOY_RESULT: ${{ needs.deploy-verify.result }}
          MASTER_SHA: ${{ needs.merge-master.outputs.master-sha }}
          HEAD_SHA: ${{ needs.merge-master.outputs.head-sha }}
        run: |
          set -euo pipefail

          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "${MERGE_RESULT}" != "success" ]; then
            say "## ❌ 没通过：你这个分支跟今天最新的主干冲突了，测试没能跑起来"
            say ""
            say "点上面「1·先合最新主干」那一项，能看到是哪几个文件打架了。"
            exit 1
          fi

          say "本次检查基于主干版本：\`${MASTER_SHA}\`（你的分支：\`${HEAD_SHA}\`）"
          say ""

          FAILED=""
          [ "${BACKEND_RESULT}"  = "success" ] || FAILED="${FAILED} 后端 fastpay-server；"
          [ "${FRONTEND_RESULT}" = "success" ] || FAILED="${FAILED} 前端 fastpay-admin / fastpay-merchant；"
          # 这一格里跑了三个脚本的自测，所以提示得把三个都提上 —— 少提一个的话，
          # 挂的要是没提到的那个，人会被指到错的文件上去查（MTM-220 / MTM-211）。
          # 以后这一格再加自测，记得回来把这一行也补上。
          [ "${DEPLOY_RESULT}"   = "success" ] || FAILED="${FAILED} 运维脚本自测（发版验证 deploy/verify-release.sh、生产操作锁 deploy/prod-lock.sh、撞车提醒 .github/scripts/pr-overlap.test.sh）；"

          if [ -z "${FAILED}" ]; then
            say "## ✅ 通过：把今天最新的主干合进来之后，全部测试都是绿的"
          else
            say "## ❌ 没通过：把今天最新的主干合进来之后，下面这些挂了"
            say ""
            say "-${FAILED}"
            say ""
            say "点对应的那一项进去看日志，就能看到具体是哪几条测试失败。"
            exit 1
          fi
