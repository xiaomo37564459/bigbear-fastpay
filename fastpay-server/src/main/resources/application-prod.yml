# Fast 易支付 - 服务端配置
server:
  port: 7001
  servlet:
    context-path: /fastpay-server


spring:
  application:
    name: fastpay-server
  
  # 数据库配置
  # 生产环境的数据库地址和账号密码一律由环境变量注入，仓库里不保留任何真实连接信息。
  # 部署时在 systemd 的 EnvironmentFile（/etc/fastpay/fastpay-server.env，权限 600）里配置：
  #   DB_DRIVER=org.postgresql.Driver     # 默认就是它，连 MySQL 时才需要改
  #   DB_URL=jdbc:postgresql://<主机>:5432/<库名>
  #   DB_USERNAME=<用户名>
  #   DB_PASSWORD=<密码>
  # DB_URL / DB_USERNAME / DB_PASSWORD 故意不设默认值：没配就启动失败，避免连错库或用默认密码上线。
  #
  # 关于时区（MTM-187）：
  #   FastPayApplication 已把 JVM 默认时区钉死到 Asia/Shanghai。连 MySQL 时 DB_URL 必须带上
  #   serverTimezone=Asia/Shanghai（例：
  #   jdbc:mysql://.../bigbear_fastpay?...&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true）
  #   以保持 JVM 侧和驱动侧的时区一致，否则会出现「订单超时不关单」这类时差偏差。
  #   连 PostgreSQL 无需额外参数，pgjdbc 直接跟着 JVM 默认时区走。
  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.fastpay.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不能开 StdOutImpl：它会把每一条 SQL 和查询结果的整行数据打到 stdout，
    # 里面包含商户 API 密钥、登录密码密文等敏感字段（MTM-239）。
    # 若要临时排查线上问题，用环境变量 MYBATIS_PLUS_CONFIGURATION_LOG_IMPL 覆盖，用完立刻取消。
    # 开发环境的开关保留在 application-dev.yml，本地调试不受影响。

# Knife4j API 文档配置
# 生产环境默认关闭：接口本身有登录保护，但把 67 个接口的完整清单公开出去，
# 等于把系统地图直接送给攻击者。要临时排查时用环境变量 SPRINGDOC_API_DOCS_ENABLED=true 打开。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fastpay.controller

knife4j:
  enable: false
  setting:
    language: zh_cn

# Fast 易支付 自定义配置
fastpay:
  # JWT 配置
  jwt:
    # 登录令牌的签名密钥，由环境变量 FASTPAY_JWT_SECRET 注入。
    # 和上面数据库那几项一样故意不设默认值：仓库是公开的，留一个默认值就等于没有安全性，
    # 而且忘配的时候会静默退回那个公开值，比直接启动失败危险得多。
    # 生成方式：openssl rand -hex 48
    secret: ${FASTPAY_JWT_SECRET}
    # Token 有效期（小时）
    expire-hours: 12
  
  # 管理员初始账号：只在数据库里没有任何管理员时用一次（首次部署）
  # - username 可通过 FASTPAY_ADMIN_INITIAL_USERNAME 覆盖，默认 admin
  # - password 故意不设默认值：不配置就在启动时随机生成一个 16 位密码，写进 initial-password-file
  #   指定的受限文件（权限 rw-------），日志里只留出口路径、不出现密码本身。避免仓库/配置文件里
  #   出现任何人尽皆知的默认口令（MTM-149 问题一），以及避免密码流进全局可读的日志文件（MTM-246）
  # - initial-password-file 默认落在后端工作目录下 fastpay-initial-admin-password.txt；
  #   生产 systemd WorkingDirectory=/opt/fastpay，所以最终是 /opt/fastpay/fastpay-initial-admin-password.txt。
  #   想换位置就设 FASTPAY_ADMIN_INITIAL_PASSWORD_FILE=/绝对/路径/xxx.txt
  admin:
    username: ${FASTPAY_ADMIN_INITIAL_USERNAME:admin}
    password: ${FASTPAY_ADMIN_INITIAL_PASSWORD:}
    initial-password-file: ${FASTPAY_ADMIN_INITIAL_PASSWORD_FILE:fastpay-initial-admin-password.txt}
  
  # 支付配置
  pay:
    # 订单超时时间（分钟）
    order-timeout-minutes: 3
    # 支付页面域名（商户前端地址）
    page-domain: ${FASTPAY_PAGE_DOMAIN:https://pay.copliot.cloud/fastpay-merchant}
  
  # 监听软件回调配置
  notify:
    # 监听软件回调地址（完整URL，用于模版展示）
    callback-url: ${FASTPAY_NOTIFY_CALLBACK_URL:https://pay.copliot.cloud/fastpay-server/api/notify/callback}

  # 登录限次（MTM-162）：拦脚本狂试密码，同时尽量不误伤真的输错一两次的人。
  # 状态存到数据库表 fp_login_attempt，服务重启后不会把攻击者的失败次数清零。
  # 阈值走默认值就够；想在生产覆盖任意一项：
  #   FASTPAY_LOGIN_LIMIT_USER_MAX_ATTEMPTS=8
  #   FASTPAY_LOGIN_LIMIT_IP_MAX_ATTEMPTS=15
  #   FASTPAY_LOGIN_LIMIT_LOCK_MINUTES=30
  # 公司出口共用 IP 想只按账号维度限次：
  #   FASTPAY_LOGIN_LIMIT_IP_WHITELIST=203.0.113.7,198.51.100.9
  login-limit:
    user-max-attempts: ${FASTPAY_LOGIN_LIMIT_USER_MAX_ATTEMPTS:5}
    ip-max-attempts: ${FASTPAY_LOGIN_LIMIT_IP_MAX_ATTEMPTS:10}
    lock-minutes: ${FASTPAY_LOGIN_LIMIT_LOCK_MINUTES:15}
    window-minutes: ${FASTPAY_LOGIN_LIMIT_WINDOW_MINUTES:15}
    ip-whitelist: ${FASTPAY_LOGIN_LIMIT_IP_WHITELIST:}

  # CORS 白名单：只有下面列出来的前端地址才能带用户凭证 (cookie / Authorization) 调后端接口。
  # MTM-177：以前是 allowedOriginPatterns("*") + allowCredentials(true)，任意网站都能冒充用户调接口。
  # 生产默认只放行 https://pay.copliot.cloud 这一个域名 —— 这也是当前唯一在跑的前端来源。
  # 以后加子域名、临时联调第三方前端，走环境变量 FASTPAY_CORS_ALLOWED_ORIGINS=https://a,https://b 覆盖，不用改代码。
  # 一定不能包含 "*"（代码里会拒绝启动），通配 + 带凭证等同修复前的洞。
  cors:
    allowed-origins: ${FASTPAY_CORS_ALLOWED_ORIGINS:https://pay.copliot.cloud}
