# Fast 易支付 - 服务端配置
server:
  port: 7001
  servlet:
    context-path: /fastpay-server


spring:
  application:
    name: fastpay-server
  
  # 数据库配置
  # 默认连 MySQL；要切到 PostgreSQL，设置下面几个环境变量即可，不用改代码：
  #   DB_DRIVER=org.postgresql.Driver
  #   DB_URL=jdbc:postgresql://localhost:5432/bigbear_fastpay
  #   DB_USERNAME=postgres
  #   DB_PASSWORD=你的密码
  #
  # 关于 serverTimezone=Asia/Shanghai（MTM-187）：
  #   MySQL Connector/J 会做「JVM 默认时区 → serverTimezone」的时间戳转换，两边不一致就会
  #   出现「订单超时不关单」这类偏差。FastPayApplication 已把 JVM 默认时区钉死到 Asia/Shanghai，
  #   所以这里保持一致，写 serverTimezone=Asia/Shanghai 让驱动的转换恰好是零偏移。
  #   PostgreSQL 侧没有这个参数，行为已经跟着 JVM 默认时区走，只要 JVM 被钉死，两条路径就对齐。
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/bigbear_fastpay?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.fastpay.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fastpay.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# Fast 易支付 自定义配置
fastpay:
  # JWT 配置
  jwt:
    # 仅限本地开发/自动化测试的示意密钥，明文放在这里是刻意为之：
    #   1) 不要把它复制到生产 —— 生产走 application-prod.yml，读环境变量 FASTPAY_JWT_SECRET
    #   2) 本地想换成自己的随机值：环境变量 FASTPAY_JWT_SECRET=$(openssl rand -hex 48) 覆盖即可
    secret: ${FASTPAY_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-prod-1a2b3c4d5e6f7890}
    # Token 有效期（小时）
    expire-hours: 12

  # 管理员初始账号（仅在数据库里没有管理员时用一次，用于本地开发和自动化测试）
  # 生产环境的对应项在 application-prod.yml 里，故意不配置密码，让 InitConfig 随机生成
  admin:
    username: admin
    password: "123456"
  
  # 支付配置
  pay:
    # 订单超时时间（分钟）
    order-timeout-minutes: 3
    # 支付页面域名（商户前端地址）；本地默认指到商户前端 dev server 3002 端口，
    # 想指向线上时用环境变量：FASTPAY_PAGE_DOMAIN=https://pay.copliot.cloud/fastpay-merchant
    page-domain: ${FASTPAY_PAGE_DOMAIN:http://localhost:3002/fastpay-merchant}

  # 监听软件回调配置
  notify:
    # 监听软件回调地址（完整URL，用于模版展示）
    callback-url: ${FASTPAY_NOTIFY_CALLBACK_URL:http://localhost:7001/fastpay-server/api/notify/callback}

  # 登录限次（MTM-162）：拦脚本狂试密码，同时尽量不误伤真的输错一两次的人。
  # 状态存到数据库表 fp_login_attempt，服务重启后不会把攻击者的失败次数清零。
  # 想在生产覆盖任意一项：环境变量 FASTPAY_LOGIN_LIMIT_USER_MAX_ATTEMPTS=8 之类。
  # 想放行公司出口 IP 只按账号维度限次：FASTPAY_LOGIN_LIMIT_IP_WHITELIST=203.0.113.7,198.51.100.9
  login-limit:
    # 同一账号在窗口内连续错这么多次就锁
    user-max-attempts: 5
    # 同一 IP 在窗口内连续错这么多次就锁（比账号维度松，避免共用出口 IP 全公司误伤）
    ip-max-attempts: 10
    # 锁定持续多少分钟
    lock-minutes: 15
    # 滑动窗口分钟数；距离首次失败超过这个数就把计数重置为 1
    window-minutes: 15
    # 命中的 IP 不做 IP 维度限次（账号维度照常）
    ip-whitelist: ""

  # CORS 白名单：只有下面列出来的前端地址才能带用户凭证 (cookie / Authorization) 调后端接口。
  # MTM-177：以前是 allowedOriginPatterns("*") + allowCredentials(true)，任意网站都能冒充用户调接口。
  # 本地开发的默认值已经把两个前端 vite dev server 和线上域名都放进去了 —— 拉下代码一条命令直接能跑。
  # 想加/换域名不用改代码：环境变量 FASTPAY_CORS_ALLOWED_ORIGINS=https://a.com,https://b.com 覆盖即可。
  # 一定不能包含 "*"（代码里会拒绝启动），通配 + 带凭证等同修复前的洞。
  cors:
    allowed-origins: ${FASTPAY_CORS_ALLOWED_ORIGINS:https://pay.copliot.cloud,http://localhost:3001,http://localhost:3002}
