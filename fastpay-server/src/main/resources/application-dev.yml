# Fast 易支付 - 服务端配置
server:
  port: 7001
  servlet:
    context-path: /fastpay-server


spring:
  application:
    name: fastpay-server
  
  # 数据库配置
  # 默认连 MySQL；要切到 PostgreSQL，设置下面几个环境变量即可，不用改代码：
  #   DB_DRIVER=org.postgresql.Driver
  #   DB_URL=jdbc:postgresql://localhost:5432/bigbear_fastpay
  #   DB_USERNAME=postgres
  #   DB_PASSWORD=你的密码
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/bigbear_fastpay?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  
  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.fastpay.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.fastpay.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# Fast 易支付 自定义配置
fastpay:
  # JWT 配置
  jwt:
    # 仅限本地开发/自动化测试的示意密钥，明文放在这里是刻意为之：
    #   1) 不要把它复制到生产 —— 生产走 application-prod.yml，读环境变量 FASTPAY_JWT_SECRET
    #   2) 本地想换成自己的随机值：环境变量 FASTPAY_JWT_SECRET=$(openssl rand -hex 48) 覆盖即可
    secret: ${FASTPAY_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-prod-1a2b3c4d5e6f7890}
    # Token 有效期（小时）
    expire-hours: 12

  # 管理员初始账号（仅在数据库里没有管理员时用一次，用于本地开发和自动化测试）
  # 生产环境的对应项在 application-prod.yml 里，故意不配置密码，让 InitConfig 随机生成
  admin:
    username: admin
    password: "123456"
  
  # 支付配置
  pay:
    # 订单超时时间（分钟）
    order-timeout-minutes: 3
    # 支付页面域名（商户前端地址）；本地默认指到商户前端 dev server 3002 端口，
    # 想指向线上时用环境变量：FASTPAY_PAGE_DOMAIN=https://pay.copliot.cloud/fastpay-merchant
    page-domain: ${FASTPAY_PAGE_DOMAIN:http://localhost:3002/fastpay-merchant}

  # 监听软件回调配置
  notify:
    # 监听软件回调地址（完整URL，用于模版展示）
    callback-url: ${FASTPAY_NOTIFY_CALLBACK_URL:http://localhost:7001/fastpay-server/api/notify/callback}
